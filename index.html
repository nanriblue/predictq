<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>다음엔? · 이 이슈의 다음 흐름을 짚어드립니다</title>
  <meta name="description" content="다음 모바일 기사뷰 하단에서 '이 기사, 다음엔 어떻게 될까요?'를 자연어 전망·흐름 카드로 이어주는 AI Agent 목업" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 데스크톱에서도 모바일 프레임 안에 보이도록 감싸는 영역 -->
  <div class="stage">
    <header class="intro">
      <span class="intro__badge">AI Agent 공모전 · 목업</span>
      <h1 class="intro__title">다음엔?</h1>
      <p class="intro__desc">이 이슈의 다음 흐름을 짚어드립니다</p>
    </header>

    <!-- 예시 기사 전환 탭 -->
    <nav class="switcher" aria-label="예시 기사 선택">
      <button class="switcher__btn is-active" data-index="0">경제</button>
      <button class="switcher__btn" data-index="1">스포츠</button>
      <button class="switcher__btn" data-index="2">시사·법적</button>
    </nav>

    <!-- 모바일 기사뷰 프레임 -->
    <div class="phone">
      <div class="phone__bar">
        <span class="phone__time">9:41</span>
        <span class="phone__brand">Daum</span>
        <span class="phone__icons">▮▮▮ ▮</span>
      </div>
      <main class="article" id="article">
        <!-- JS가 렌더링 -->
      </main>
    </div>

    <footer class="credit">
      더미 데이터 기반 목업입니다 · 실제 수치/뉴스는 예시이며 투자·법률 자문이 아닙니다
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
